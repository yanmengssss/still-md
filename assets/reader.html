<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #fff; color: #243044; font: 16px/1.7 system-ui, sans-serif; }
    #content { max-width: 850px; margin: 0 auto; padding: 26px 24px 80px; overflow-wrap: anywhere; }
    h1,h2,h3,h4,h5,h6 { color:#172336; line-height:1.3; margin:1.5em 0 .6em; scroll-margin-top:20px; }
    h1 { font-size:2em; border-bottom:1px solid #e5e8ed; padding-bottom:.35em; }
    h2 { font-size:1.5em; border-bottom:1px solid #edf0f3; padding-bottom:.25em; }
    h3 { font-size:1.25em; }
    p,ul,ol,blockquote,pre,table { margin:0 0 1.1em; }
    a { color:#315db5; }
    img,svg { max-width:100%; height:auto; }
    blockquote { border-left:4px solid #d4deee; margin-left:0; padding:2px 16px; color:#5a687a; }
    pre { overflow-x:auto; border-radius:10px; padding:16px; background:#f4f6f9; font:14px/1.5 ui-monospace, monospace; }
    code { background:#f4f6f9; border-radius:4px; padding:2px 4px; font: .88em ui-monospace, monospace; }
    pre code { padding:0; background:none; }
    table { border-collapse:collapse; display:block; overflow-x:auto; }
    th,td { border:1px solid #dce2e9; padding:7px 12px; }
    th { background:#f5f7fa; }
    hr { border:0; border-top:1px solid #e5e8ed; }
    .mermaid { overflow-x:auto; text-align:center; margin:20px 0; }
    .mermaid-error { color:#a33; background:#fff0f0; padding:12px; border-radius:8px; }
  </style>
  <script src="mermaid.min.js"></script>
</head>
<body>
  <main id="content"></main>
  <script>
    mermaid.initialize({startOnLoad:false, securityLevel:'strict', theme:'default'});
    window.renderMarkdown = function(html) {
      const content = document.getElementById('content');
      content.innerHTML = html;
      const headings = Array.from(content.querySelectorAll('h1,h2,h3,h4,h5,h6')).map((node, i) => {
        node.id = 'heading-' + i;
        return {id:node.id, title:node.textContent.trim(), level:Number(node.tagName[1])};
      });
      document.querySelectorAll('pre > code').forEach(code => {
        if (!/(^|\s)language-mermaid(\s|$)/.test(code.className)) return;
        const diagram = document.createElement('div');
        diagram.className = 'mermaid';
        diagram.textContent = code.textContent;
        code.parentElement.replaceWith(diagram);
      });
      window.scrollTo(0,0);
      Reader.postMessage(JSON.stringify({type:'headings', headings}));
      try { mermaid.init(undefined, document.querySelectorAll('.mermaid')); }
      catch (error) { document.querySelectorAll('.mermaid').forEach(el => el.classList.add('mermaid-error')); }
    };
    window.jumpToHeading = function(id) { document.getElementById(id)?.scrollIntoView({behavior:'smooth'}); };
    document.addEventListener('click', event => {
      const a = event.target.closest('a');
      if (!a) return;
      event.preventDefault();
      Reader.postMessage(JSON.stringify({type:'link', href:a.getAttribute('href') || ''}));
    });
  </script>
</body>
</html>
